basis: >
  26 U.S.C. § 6103(l)(7) directs the Secretary of the Treasury to disclose return information
  with respect to unearned income to federal, state, and local agencies administering specified
  federally-assisted benefit programs — including Supplemental Security Income (Title XVI of the
  Social Security Act). AUTHORIZES the disclosure; it does not, by itself, witness the match
  (the CMA does).
