basis: >
  Treasury press release "Treasury Announces the Launch of the Trump Accounts App and Next
  Steps for Trump Accounts" (sb0508). Families open accounts by filing IRS Form 4547 on
  TrumpAccounts.gov; Treasury operates the Trump Accounts app; activation emails come only from
  no-reply@TrumpAccounts.Treasury.gov; Treasury deposits the one-time $1,000 contribution into
  eligible children's accounts beginning July 4, 2026.
