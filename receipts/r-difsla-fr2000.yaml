basis: >
  Federal Register notice of the SSA/IRS computer matching program, Match #1016 (Nov 16 2000):
  the IRS discloses return information to SSA to verify Title XVI (SSI) eligibility and/or correct
  benefit amounts for aged, blind, and disabled individuals — establishing the unearned-income
  match that the current CMA re-establishes. Cited for lineage (the match has recurred since 2000).
