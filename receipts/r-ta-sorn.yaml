basis: >
  Privacy Act SORN, "Department of the Treasury, .031 — Trump Accounts Program (TAP) System
  of Records" (FR 2026-07514, Apr 17 2026). The system "supports the Treasury's
  administration, oversight and compliance activities associated with Trump accounts," a type
  of traditional IRA under 26 U.S.C. 530A; records "enable Treasury to administer and oversee
  program operations, ensure compliance with applicable statutory requirements, and carry out
  the objectives for Trump accounts."
